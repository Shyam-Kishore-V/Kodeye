# Render.com deployment configuration
# Free tier — no credit card required

services:
  - type: web
    name: kodeye
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: DEFAULT_PROVIDER
        value: groq
      - key: DEFAULT_MODEL
        value: llama-3.3-70b-versatile